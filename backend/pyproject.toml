[tool.poetry]
name = "fermaagent-backend"
version = "0.1.0"
description = "FermaAgent backend service"
authors = ["FermaAgent Team"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.133.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
supabase = "^2.10.0"
scikit-learn = "^1.5.0"
joblib = "^1.4.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
python-dotenv = "^1.0.0"
google-genai = "^2.19.0"
google-adk = "^2.9.2"
pydantic = "^2.9.0"
nest-asyncio = "^1.6.0"
rich = "^15.0.0"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.1.0"
pytest = "^8.3.0"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
